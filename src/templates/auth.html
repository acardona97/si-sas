<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Iniciar sesión" if mode == "login" else "Crear cuenta" }} — Sí S.A.S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260528b">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-header">
            <a href="/"><img src="/static/img/logo_quarta.svg" alt="Quarta Acompañamiento Legal" class="auth-logo-img"></a>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <a href="/login"    class="auth-tab {% if mode == 'login'    %}active{% endif %}">Iniciar sesión</a>
            <a href="/register" class="auth-tab {% if mode == 'register' %}active{% endif %}">Crear cuenta</a>
        </div>

        <!-- Error -->
        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <!-- Login -->
        {% if mode == "login" %}
        <form method="post" action="/login" class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required
                       placeholder="correo@empresa.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn auth-btn-submit">Ingresar →</button>
        </form>
        <p class="auth-switch">¿No tiene cuenta? <a href="/register">Registrarse gratis</a></p>

        <!-- Register -->
        {% else %}
        <form method="post" action="/register" class="auth-form">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Nombre y apellidos" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico *</label>
                <input type="email" id="email" name="email" required
                       placeholder="correo@empresa.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña * <span class="auth-hint">(mínimo 8 caracteres)</span></label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar contraseña *</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       placeholder="••••••••" autocomplete="new-password">
            </div>
            <button type="submit" class="btn auth-btn-submit">Crear cuenta →</button>
        </form>
        <p class="auth-switch">¿Ya tiene cuenta? <a href="/login">Iniciar sesión</a></p>
        {% endif %}

        <div class="auth-back">
            <a href="/">← Volver al inicio</a>
        </div>
    </div>
</div>

</body>
</html>
